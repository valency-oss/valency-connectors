name: Installer

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: npm run lint:installer
      - run: npm run test:installer

  bash-3-2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Bash 3.2
        run: |
          docker run --rm -v "$PWD:/work" -w /work bash:3.2 bash -n installer/install.sh
          docker run --rm -v "$PWD:/work" -w /work bash:3.2 bash installer/tests/installer_test.sh
