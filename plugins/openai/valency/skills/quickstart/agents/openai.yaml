interface:
  display_name: "Valency Quickstart"
  short_description: "Learn how Valency fits your research work"
  icon_small: "./assets/favicon_solid_cyan_valency.svg"
  icon_large: "./assets/favicon_solid_cyan_valency.svg"
  brand_color: "#00E6FF"
  default_prompt: "Help me get started with Valency Bond and show me how to use it for my research."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "valency"
      description: "Use the complete Valency Bond MCP surface"
      transport: "streamable_http"
      url: "https://labs.valency.io/mcp/"
